{% extends 'base.html' %}

{% block content %}
<style>
body {
    background: #0b1220;
    font-family: 'Inter', sans-serif;
    color: #e5e7eb;
}
.auth-wrapper {
    min-height: 80vh;
    display: flex;
    align-items: center;
    justify-content: center;
}
.card {
    background: rgba(15, 23, 42, 0.75) !important;
    border: 1px solid rgba(56, 189, 248, 0.12) !important;
    border-radius: 16px;
    box-shadow: 0 18px 45px rgba(0,0,0,0.55);
    overflow: hidden;
}
.card-header {
    background: linear-gradient(135deg, #38bdf8, #1e293b) !important;
    border: none;
    padding: 16px;
    text-align: center;
}

.card-header h4 {
    margin: 0;
    color: #0b1220;
    font-weight: 700;
}

.card-header small {
    color: rgba(11,18,32,0.8);
}
.card-body {
    padding: 26px;
    color: #e5e7eb;
}
form p {
    margin-bottom: 16px;
}

label {
    display: block;
    margin-bottom: 6px;
    color: #cbd5e1 !important;
    font-size: 13px;
    font-weight: 500;
    letter-spacing: 0.3px;
}

input,
select,
textarea {
    width: 100%;
    padding: 11px 12px;
    border-radius: 12px;
    border: 1px solid rgba(56, 189, 248, 0.18);
    background: rgba(15, 23, 42, 0.85);
    color: #e5e7eb !important;
    font-size: 14px;
    outline: none;
    transition: 0.25s ease;
}
input::placeholder,
textarea::placeholder {
    color: rgba(148,163,184,0.7);
}
input:focus,
select:focus,
textarea:focus {
    border-color: #38bdf8;
    box-shadow: 0 0 0 3px rgba(56,189,248,0.18);
    background: rgba(15, 23, 42, 0.95);
    color: #ffffff;
}
.btn-primary {
    background: linear-gradient(135deg, #38bdf8, #1e293b);
    border: none;
    color: #ffffff;
    border-radius: 10px;
    padding: 10px;
    font-weight: 600;
    transition: 0.25s ease;
}
.btn-primary:hover {
    transform: translateY(-2px);
    box-shadow: 0 12px 28px rgba(56,189,248,0.25);
}
.btn-secondary {
    background: rgba(191, 201, 224, 0.6);
    border: 1px solid rgba(56, 189, 248, 0.2);
    color: #cbd5e1;
    border-radius: 10px;
}
.alert {
    border-radius: 10px;
    font-size: 13px;
}
.alert-success {
    background: rgba(34,197,94,0.15);
    border: 1px solid rgba(34,197,94,0.3);
    color: #86efac;
}
.alert-danger {
    background: rgba(239,68,68,0.15);
    border: 1px solid rgba(239,68,68,0.3);
    color: #fca5a5;
}
.card * {
    color: inherit;
}
</style>
<div class="container-fluid px-3 px-md-5 mt-4">
    <div class="row justify-content-center">
<div class="col-12 col-sm-10 col-md-8 col-lg-5">
     <div class="card shadow-lg border-0 rounded-4">
    <div class="card-header bg-dark text-white text-center rounded-top-4 py-3">
              <h4 class="mb-0">Reset Password</h4>
          <small>For user: {{ user_obj.username }}</small>
         </div>
  <div class="card-body p-3 p-md-4">
 <form method="POST">
             {% csrf_token %}
                        <div class="mb-3">
                            <label class="form-label">Old Password</label>
                            <input type="password" name="old_password"
                                   class="form-control form-control-lg"
                                   placeholder="Enter old password" required></div>
                        <div class="mb-3">
                            <label class="form-label">New Password</label>
                            <input type="password" name="new_password"
                                   class="form-control form-control-lg"
                                   placeholder="Enter new password" required></div>

                        <div class="mb-3">
                            <label class="form-label">Confirm Password</label>
                            <input type="password" name="confirm_password"
                                   class="form-control form-control-lg"
                                   placeholder="Confirm new password" required>
                        </div>
                        <div class="d-flex flex-column flex-sm-row gap-2 justify-content-between">
                            <a href="{% url 'user_list' %}"
                               class="btn btn-secondary w-100 w-sm-auto">⬅ Back </a>
         <button type="submit"
             class="btn btn-warning w-100 w-sm-auto">🔐 Reset Password </button>
</div>
  </form>
      </div>
            </div>
        </div>

    </div>
</div>
{% endblock %}
