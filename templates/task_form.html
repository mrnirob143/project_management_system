{% extends 'base.html' %}

{% block content %}

<style>
body {
    background: #0b1220;
    font-family: 'Inter', sans-serif;
    color: #e5e7eb;
}
.auth-wrapper {
    min-height: 80vh;
    display: flex;
    align-items: center;
    justify-content: center;
}
.card {
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.10);
    border-radius: 16px;
    box-shadow: 0 18px 45px rgba(0,0,0,0.45);
    overflow: hidden;
}
.card-header {
    background: linear-gradient(135deg, #38bdf8, #1e293b);
    padding: 16px;
    text-align: center;
    border: none;
}
.card-header h4 {
    margin: 0;
    color: #ffffff;
    font-weight: 600;
}
.card-body {
    padding: 24px;
}
label {
    color: #e2e8f0 !important;
    font-size: 14px;
    margin-bottom: 6px;
    display: block;
}
input,
textarea,
select,
.form-control {
    width: 100%;
    padding: 10px 12px;
    border-radius: 10px;
    background: #ffffff !important;
    color: #111827 !important;
    border: 1px solid #d1d5db;
    outline: none;
    font-size: 14px;
}

input::placeholder,
textarea::placeholder {
    color: #6b7280;}
input:focus,
textarea:focus,
select:focus,
.form-control:focus {
    border-color: #38bdf8;
    box-shadow: 0 0 0 3px rgba(56,189,248,0.25);
    background: #ffffff !important;
    color: #111827 !important;
}
select option {
    background: #ffffff;
    color: #111827;
}
.btn-primary {
    background: linear-gradient(135deg, #38bdf8, #1e293b);
    border: none;
    color: #ffffff;
    border-radius: 10px;
    padding: 10px;
    font-weight: 500;
    transition: 0.25s ease;
}
.btn-primary:hover {
    transform: translateY(-2px);
    box-shadow: 0 12px 28px rgba(56,189,248,0.25);
}
.btn-secondary {
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.15);
    color: #e5e7eb;
    border-radius: 10px;
}
.alert-success {
    background: rgba(34,197,94,0.15);
    border: 1px solid rgba(34,197,94,0.3);
    color: #86efac;
}
.alert-danger {
    background: rgba(239,68,68,0.15);
    border: 1px solid rgba(239,68,68,0.3);
    color: #fca5a5;
}
</style>
<div class="container mt-4">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow">
                <div class="card-header bg-info text-white text-center">
                    <h4>{% if form.instance.pk %}Edit Task{% else %}Add Task{% endif %}</h4>
                </div>
                <div class="card-body">
                    <form method="POST" id="taskForm">
                        {% csrf_token %}
                        {{ form.as_p }}
                        <button type="submit" class="btn btn-info w-100 mt-2">
                            Submit
                        </button>
                        <a href="javascript:history.back()" class="btn btn-outline-secondary w-100 mt-2">  Back</a>
                    </form>
                    <div id="successMsg" class="alert alert-success mt-3 d-none">
                        Task saved successfully!</div>
                </div>     </div>
        </div>
    </div>
</div>
<script>
document.getElementById("taskForm").addEventListener("submit", function(e){
    e.preventDefault();
    let form = this;
    let formData = new FormData(form);
    fetch("", {
        method: "POST",
        headers: {
            "X-Requested-With": "XMLHttpRequest"},
        body: formData})
    .then(response => response.json())
    .then(data => {
        if(data.success){
            let msg = document.getElementById("successMsg");
            msg.classList.remove("d-none");
            form.reset();
            setTimeout(function(){
                window.location.href = data.redirect_url; }, 1000);
        } else {
            alert("Error occurred!");
        }
    })
    .catch(error => console.log(error));
});
</script>
{% endblock %}
