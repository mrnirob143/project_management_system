{% extends 'base.html' %}

{% block content %}
<style>
    /* =========================================================
   ⭐ ADD MEMBERS PAGE UI (FINAL - NAVBAR SAFE)
========================================================= */

/* ================= PAGE BASE ================= */
body {
    background: linear-gradient(135deg, #0b1220, #0f172a);
    font-family: 'Inter', sans-serif;
}

/* ================= PAGE TEXT ================= */
.container {
    color: #e5e7eb;
}

/* ================= MAIN CARD ================= */
.card {
    background: rgba(15, 23, 42, 0.55) !important;
    border: 1px solid rgba(56, 189, 248, 0.10) !important;
    border-radius: 20px !important;
    backdrop-filter: blur(12px);
    box-shadow: 0 18px 45px rgba(0,0,0,0.45);
}

/* ================= HEADER ================= */
.card .bg-dark {
    background: linear-gradient(135deg, #0ea5e9, #1e293b) !important;
    border-bottom: 1px solid rgba(255,255,255,0.08);
    text-align: center;
}

.card .bg-dark h4 {
    color: #ffffff;
    font-weight: 600;
}

.card .bg-dark small {
    color: #e2e8f0 !important;
    opacity: 0.8;
}

/* ================= FORM LABEL ================= */
.form-label {
    color: #e5e7eb !important;
    font-weight: 600;
}

/* ================= CHECKBOX BOX ================= */
.border.rounded-4 {
    background: rgba(2, 6, 23, 0.65) !important;
    border: 1px solid rgba(56, 189, 248, 0.15) !important;
    border-radius: 16px !important;

    padding: 18px !important;
    max-height: 320px;
    overflow-y: auto;
}

/* ================= CHECKBOX ROW ================= */
.form-check {
    display: flex;
    align-items: center;
    gap: 10px;

    padding: 10px 10px;
    margin-bottom: 6px;

    border-radius: 10px;
    transition: 0.2s ease;
}

.form-check:hover {
    background: rgba(56, 189, 248, 0.08);
    padding-left: 14px;
}

/* ================= CHECKBOX INPUT ================= */
.form-check-input {
    margin: 0 !important;
    flex-shrink: 0;

    transform: scale(1.05);
    cursor: pointer;

    border: 1px solid #38bdf8;
    background-color: transparent;
}

/* ================= LABEL TEXT ================= */
.form-check-label {
    margin: 0 !important;
    padding: 0 !important;

    color: #e5e7eb !important;
    line-height: 1.4;
}

/* employee tag */
.text-muted {
    color: #94a3b8 !important;
}

/* ================= BUTTON PRIMARY ================= */
.btn-primary {
    background: linear-gradient(135deg, #38bdf8, #1e293b) !important;
    border: none !important;
    border-radius: 14px !important;
    color: #fff !important;
    font-weight: 600;
    transition: 0.25s ease;
}

.btn-primary:hover {
    transform: translateY(-2px);
    box-shadow: 0 12px 30px rgba(56, 189, 248, 0.25);
}

/* ================= BACK BUTTON ================= */
.btn-outline-secondary {
    border: 1px solid rgba(148, 163, 184, 0.4) !important;
    color: #e5e7eb !important;
    border-radius: 14px !important;
    background: transparent !important;
}

.btn-outline-secondary:hover {
    background: rgba(148, 163, 184, 0.1) !important;
}

/* ================= ALERT ================= */
.alert {
    background: rgba(34, 197, 94, 0.12) !important;
    border: 1px solid rgba(34, 197, 94, 0.25) !important;
    color: #86efac !important;
    border-radius: 14px !important;
}

/* ================= SCROLLBAR ================= */
.border.rounded-4::-webkit-scrollbar {
    width: 6px;
}

.border.rounded-4::-webkit-scrollbar-thumb {
    background: rgba(56, 189, 248, 0.4);
    border-radius: 10px;
}
</style>

<div class="container py-5">

    <div class="row justify-content-center">

        <div class="col-lg-6 col-md-9">

            <div class="card border-0 shadow-lg rounded-5 overflow-hidden">

                <div class="bg-dark text-white text-center p-4">
                    <h4 class="mb-1">👥 Add Members</h4>
                    <small class="text-light opacity-75">
                        {{ project.Name }}
                    </small>
                </div>

                <div class="card-body p-4">

                    <form method="POST">
                        {% csrf_token %}

                        <label class="form-label fw-semibold mb-2">
                            Select Employees
                        </label>

                        <!-- ✅ CHECKBOX STYLE (FINAL FIX) -->
                        <div class="border rounded-4 p-3 bg-light shadow-sm">

                            {% for user in unassigned_users %}

                                <div class="form-check mb-2">

                                    <input class="form-check-input"
                                           type="checkbox"
                                           name="user_ids"
                                           value="{{ user.id }}"
                                           id="user{{ user.id }}">

                                    <label class="form-check-label" for="user{{ user.id }}">
                                        {{ user.username }} <span class="text-muted">[Employee]</span>
                                    </label>

                                </div>

                            {% empty %}
                                <p class="text-muted">No users available</p>
                            {% endfor %}

                        </div>

                        <button type="submit"
                                class="btn btn-primary w-100 mt-4 py-2 rounded-4 fw-semibold shadow-sm">
                            ➕ Add Members
                        </button>

                        <a href="{% url 'project_detail' project.ID %}"
                           class="btn btn-outline-secondary w-100 mt-2 py-2 rounded-4">
                            ← Back to Project
                        </a>

                    </form>

                    {% if messages %}
                        <div class="mt-3">
                            {% for message in messages %}
                                <div class="alert alert-success rounded-4 shadow-sm">
                                    {{ message }}
                                </div>
                            {% endfor %}
                        </div>
                    {% endif %}

                </div>
            </div>
        </div>
    </div>
</div>

{% endblock %}
