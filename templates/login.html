{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Task Management System - Login</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

<style>
body {
    font-family: 'Inter', sans-serif;
    margin: 0;
    min-height: 100vh;
    background: linear-gradient(-45deg, #050b1a, #0b1220, #0f172a, #020617);
    background-size: 400% 400%;
    animation: bg 18s ease infinite;
    color: #e5e7eb;
}
@keyframes bg {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
}
.login-wrapper {
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
}
.login-card {
    width: 420px;
    border-radius: 18px;

    background: rgba(15, 23, 42, 0.75);
    backdrop-filter: blur(14px);

    border: 1px solid rgba(56, 189, 248, 0.12);

    box-shadow: 0 18px 45px rgba(0,0,0,0.55);

    overflow: hidden;
    transition: 0.3s ease;
}

.login-card:hover {
    transform: translateY(-4px);
    box-shadow: 0 25px 60px rgba(0,0,0,0.65);
}

.login-header {
    text-align: center;
    padding: 28px 20px 10px;

    background: linear-gradient(135deg, #0ea5e9, #1e293b);
    color: #ffffff;
}

.login-header h2 {
    margin: 0;
    font-weight: 700;
}

.login-header p {
    margin: 5px 0 0;
    font-size: 13px;
    color: #e2e8f0;
    opacity: 0.9;
}

.login-body {
    padding: 25px 28px 30px;
}
.input-group {
    margin-bottom: 16px;
}

.input-group-text {
    background: rgba(56, 189, 248, 0.12);
    border: 1px solid rgba(56, 189, 248, 0.2);
    color: #e5e7eb;
}

.form-control {
    background: rgba(2, 6, 23, 0.65);
    border: 1px solid rgba(56, 189, 248, 0.15);

    color: #ffffff !important;

    border-radius: 12px;
    padding: 12px;

    outline: none;
}

.form-control::placeholder {
    color: rgba(148,163,184,0.7);
}

.form-control:focus {
    border-color: #38bdf8;
    box-shadow: 0 0 0 3px rgba(56,189,248,0.2);
    background: rgba(2, 6, 23, 0.85);
}
.btn-login {
    width: 100%;

    background: linear-gradient(135deg, #0ea5e9, #1e293b);
    border: none;

    color: #ffffff;
    font-weight: 600;

    padding: 12px;
    border-radius: 12px;

    transition: 0.25s ease;
}

.btn-login:hover {
    transform: translateY(-2px);
    box-shadow: 0 12px 30px rgba(56,189,248,0.25);
}

.btn-login:active {
    transform: scale(0.98);
}
.alert {
    border-radius: 10px;
    font-size: 13px;
    background: rgba(15,23,42,0.85);
    border: 1px solid rgba(56,189,248,0.15);
    color: #e5e7eb;
}
</style>
</head>
<body>
<div class="login-wrapper">
    <div class="login-card">
        <div class="login-header">
            <h2>📋 Task Management System</h2>
            <p>Sign in to manage your projects & tasks</p>
        </div>
        <div class="login-body">
            {% if messages %}
                {% for message in messages %}
                    <div class="alert alert-{{ message.tags }}">
                        {{ message }}
                    </div>
                {% endfor %}
            {% endif %}
            <form method="POST">
                {% csrf_token %}
                <div class="input-group">
                    <span class="input-group-text">
                        <i class="bi bi-person"></i>
                    </span>
                    <input type="text"
                           name="username"
                           id="username"
                           class="form-control"
                           placeholder="Username">
                </div>
                <div class="input-group">
                    <span class="input-group-text">
                        <i class="bi bi-lock"></i>
                    </span>
                    <input type="password"
                           name="password"
                           id="password"
                           class="form-control"
                           placeholder="Password">
                    <span class="input-group-text"
                          style="cursor:pointer;"
                          onclick="togglePassword()">
                        <i class="bi bi-eye" id="eyeIcon"></i>
                    </span>
                </div>
                <button class="btn btn-login w-100 text-white mt-2">
                    Sign In
                </button>
            </form>
        </div>
    </div>
</div>

<script>
function togglePassword() {
    let input = document.getElementById("password");
    let icon = document.getElementById("eyeIcon");

    if (input.type === "password") {
        input.type = "text";
        icon.classList.remove("bi-eye");
        icon.classList.add("bi-eye-slash");
    } else {
        input.type = "password";
        icon.classList.remove("bi-eye-slash");
        icon.classList.add("bi-eye");
    }
}
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
